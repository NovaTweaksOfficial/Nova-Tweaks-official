name: Build Nova Tweaks EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell version:"
          $PSVersionTable.PSVersion

      - name: Verify tweaks
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./shared/tools/Check-Tweaks.ps1

      - name: Install PS2EXE
        shell: pwsh
        run: |
          Install-Module PS2EXE -Scope CurrentUser -Force -AllowClobber
          Write-Host "PS2EXE installed"

      - name: Compile separate apps
        shell: pwsh
        run: |
          $shared = Get-Content "shared/Nova_Tweaks_WebGUI.ps1" -Raw
          if (-not $shared) { Write-Error "Shared engine not found"; exit 1 }

          # Build one self-contained script per product: product env vars + the shared engine.
          # The shared engine has no $PSScriptRoot dependencies, so it runs from the merged file.
          $products = @(
            @{
              Name  = "NovaTweaks"
              Title = "Nova Tweaks"
              Desc  = "Nova Tweaks performance suite - combined build"
              Game  = ""
              Var   = "NovaTweaks"
            },
            @{
              Name  = "NovaTweaks-Fortnite-Windows"
              Title = "Nova Tweaks - Fortnite (Windows)"
              Desc  = "Nova Tweaks for Fortnite on Windows"
              Game  = "Fortnite"
              Var   = "NovaTweaksFortnite"
            },
            @{
              Name  = "NovaTweaks-Minecraft-Windows"
              Title = "Nova Tweaks - Minecraft (Windows)"
              Desc  = "Nova Tweaks for Minecraft on Windows"
              Game  = "Minecraft"
              Var   = "NovaTweaksMinecraft"
            }
          )

          New-Item -ItemType Directory -Force -Path build | Out-Null

          foreach ($p in $products) {
            $prelude = ""
            if ($p.Game) { $prelude += "`$env:NOVA_FIXED_GAME = '$($p.Game)'`r`n" }
            $prelude += "`$env:NOVA_APP_VARIANT = '$($p.Var)'`r`n"
            $merged = Join-Path "build" "$($p.Name).ps1"
            Set-Content -Path $merged -Value ($prelude + $shared) -Encoding UTF8

            $out = "$($p.Name).exe"
            Invoke-PS2EXE `
              -InputFile $merged `
              -OutputFile $out `
              -Title $p.Title `
              -Description $p.Desc `
              -Company "Nova Tweaks" `
              -Product $p.Title `
              -Version "1.0.0.0" `
              -RequireAdmin `
              -NoConsole `
              -STA `
              -x64

            if (-not (Test-Path $out)) { Write-Error "Build failed: $out"; exit 1 }
            $size = [math]::Round((Get-Item $out).Length / 1MB, 2)
            Write-Host "Built $out ($size MB)"
          }

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaTweaks_Windows_EXEs
          path: |
            NovaTweaks.exe
            NovaTweaks-Fortnite-Windows.exe
            NovaTweaks-Minecraft-Windows.exe
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            NovaTweaks.exe
            NovaTweaks-Fortnite-Windows.exe
            NovaTweaks-Minecraft-Windows.exe
          tag_name: ${{ github.ref_name }}

  build-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bundle PowerShell 7
        shell: bash
        run: |
          set -euo pipefail
          APP="macos/Minecraft/Nova Tweaks Minecraft.app"
          RES="$APP/Contents/Resources"
          cp shared/Nova_Tweaks_WebGUI.ps1 "$RES/Nova_Tweaks_WebGUI.ps1"
          PWSH_VERSION="7.4.6"
          curl -fL -o /tmp/pwsh.tar.gz "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-osx-x64.tar.gz"
          rm -rf "$RES/pwsh"
          mkdir -p "$RES/pwsh"
          tar -xzf /tmp/pwsh.tar.gz -C "$RES/pwsh"
          chmod +x "$RES/pwsh/pwsh"
          rm -rf "$RES/pwsh/ref"
          rm -f "$RES/pwsh"/*.xml
          # Trim runtime pieces the Nova engine never uses.
          rm -f "$RES/pwsh/Microsoft.CodeAnalysis.CSharp.dll" "$RES/pwsh/Microsoft.CodeAnalysis.dll" "$RES/pwsh/System.Private.ServiceModel.dll"
          find "$RES/pwsh" -maxdepth 1 -type d \( -name '??' -o -name '??-??' \) -exec rm -rf {} +
          rm -rf "$RES/pwsh/Schemas"
          rm -rf "$RES/pwsh/Modules/Microsoft.PowerShell.PSResourceGet" \
                 "$RES/pwsh/Modules/PowerShellGet" \
                 "$RES/pwsh/Modules/PackageManagement" \
                 "$RES/pwsh/Modules/PSReadLine" \
                 "$RES/pwsh/Modules/Microsoft.PowerShell.Archive" \
                 "$RES/pwsh/Modules/ThreadJob"
          test -x "$RES/pwsh/pwsh"
          du -sh "$RES/pwsh"

      - name: Build macOS zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd macos/Minecraft
          ditto -c -k --sequesterRsrc --keepParent "Nova Tweaks Minecraft.app" "../../dist/Nova-Tweaks-Minecraft-macOS.zip"
          ls -lh ../../dist/Nova-Tweaks-Minecraft-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaTweaks_macOS_App
          path: dist/Nova-Tweaks-Minecraft-macOS.zip
          retention-days: 30

      - name: Attach macOS asset to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/Nova-Tweaks-Minecraft-macOS.zip
          tag_name: ${{ github.ref_name }}
