name: Build Nova Tweaks EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell version:"
          $PSVersionTable.PSVersion

      - name: Verify tweaks
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/Check-Tweaks.ps1

      - name: Install PS2EXE
        shell: pwsh
        run: |
          Install-Module PS2EXE -Scope CurrentUser -Force -AllowClobber
          Write-Host "PS2EXE installed"

      - name: Compile to EXE
        shell: pwsh
        run: |
          $scriptPath = "Nova_Tweaks_WebGUI.ps1"
          $outputPath = "NovaTweaks.exe"
          if (-not (Test-Path $scriptPath)) {
            Write-Error "Script not found: $scriptPath"
            exit 1
          }
          Invoke-PS2EXE `
            -InputFile $scriptPath `
            -OutputFile $outputPath `
            -Title "Nova Tweaks" `
            -Description "Nova Tweaks performance suite - by Kyle Bonebrake" `
            -Company "Nova Tweaks" `
            -Product "Nova Tweaks" `
            -Version "1.0.0.0" `
            -RequireAdmin `
            -NoConsole `
            -STA `
            -x64
          if (Test-Path $outputPath) {
            Write-Host "Build successful: $outputPath"
            $size = (Get-Item $outputPath).Length
            Write-Host "File size: $([math]::Round($size/1MB,2)) MB"
          } else {
            Write-Error "Build failed - EXE not created"
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaTweaks_EXE
          path: NovaTweaks.exe
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: NovaTweaks.exe
          tag_name: ${{ github.ref_name }}
