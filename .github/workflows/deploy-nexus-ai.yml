name: Deploy NEXUS AI to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'nexus-ai/**'
      - '.github/workflows/deploy-nexus-ai.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexus-ai/package-lock.json
      - name: Install
        working-directory: nexus-ai
        run: npm ci
      - name: Build
        working-directory: nexus-ai
        env:
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nexus-ai/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4