name: NEXUS AI (build & deploy)

on:
  push:
    branches: [main, master]
    paths:
      - 'nexus-ai/**'
      - '.github/workflows/deploy-nexus-ai.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexus-ai-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexus-ai/package-lock.json
      - name: Install
        working-directory: nexus-ai
        run: npm ci
      - name: Build
        working-directory: nexus-ai
        env:
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL || secrets.BACKEND_URL }}
        run: npm run build
      # The published copy lives in docs/nexus-ai so it ships with the existing
      # branch-based Pages site (main -> /docs). Commit it from the repo when
      # nexus-ai source changes:
      #   rm -rf docs/nexus-ai && cp -R nexus-ai/dist docs/nexus-ai
      - name: Verify published copy is current
        run: |
          if ! diff -q nexus-ai/dist/index.html docs/nexus-ai/index.html >/dev/null 2>&1; then
            echo "::warning::docs/nexus-ai is out of date. Run: rm -rf docs/nexus-ai && cp -R nexus-ai/dist docs/nexus-ai"
          fi
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: nexus-ai/dist

  deploy:
    # Manual-only: this repo's Pages site is currently served from main -> /docs,
    # so a root deploy would replace the Nova Tweaks storefront.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
